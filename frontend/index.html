<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - An AI-Driven 8-bit Web Game For Personalized College Program Matching and Career Exploration</title>
    <link rel="icon" type="image/x-icon" href="Logo.png">
    <link rel="stylesheet" href="./styles/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&family=Micro+5&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        #loginTitle{
            font-size: 7.5vmin;
            text-shadow: 0.2vmin 0.2vmin var(--color-green-main);
            letter-spacing: 0.2vmin;
            color: #fff;
            user-select: none;
        }

        #loginContainer{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-md);
            width: 100%;
            box-sizing: border-box;

            #guestButton{
                font-family: "Jersey 10";
                font-size: 3.8vmin;
                color: var(--color-green-main);
                background-color: #fff;
                border: 0.5vmin solid var(--color-green-light);
                box-shadow: var(--shadow-control);

                margin-top: var(--space-xl);
                padding: var(--space-md);
                width: 70vmin;
                box-sizing: border-box;

                &:hover{
                    color: #fff;
                    background-color: var(--color-green-light);
                    border: 0.5vmin solid #fff;
                }
            }

            .lineDivider{
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                align-items: center;
                gap: var(--space-md);
                user-select: none;
                width: 100%;
                box-sizing: border-box;
                        
                .line{
                    flex: auto;
                    flex-basis: auto;
                    border: none;
                    outline: none;
                    height: 0.5vmin;
                    background: #fff;
                }

                .text{
                    font-size: 5vmin;
                    color: #fff;
                    text-shadow: 0.2vmin 0.2vmin #000;
                }
            }

            #accountLoginLayout{
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: var(--space-md);
                max-width: 92vmin;
                width: 100%;
                box-sizing: border-box;

                #inputEmailId, #passWrapper{
                    flex: 1;
                    min-width: 46vmin;
                    box-sizing: border-box;

                    &:focus { border-color: #555; }
                }

                #inputEmailId{
                    font-family: "Jersey 10";
                    font-size: 3.8vmin;
                    padding: var(--space-md);
                    border-radius: var(--radius-sm);
                    border: 0.6vmin solid var(--color-green-light);
                }

                #passWrapper{
                    position: relative;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: var(--space-md);
                    border-radius: var(--radius-sm);
                    background: #fff;
                    border: 0.6vmin solid var(--color-green-light);

                    #inputPassword{
                        font-family: "Jersey 10";
                        font-size: 3.8vmin;
                        border: 0;
                        outline: none;
                        width: stretch;
                        box-sizing: border-box;
                    }

                    button{
                        background: none;
                        border: none;
                        cursor: pointer;
                        display: flex;

                        img{
                            position: relative;
                            width: auto;
                            height: 3.8vmin;
                            pointer-events: none;
                            filter: invert(48%) sepia(13%) saturate(924%) hue-rotate(68deg) brightness(92%) contrast(85%);
                        }
                    }
                }
            }

            #loginButton{
                font-family: "Jersey 10";
                font-size: 3.8vmin;
                color: var(--color-green-main);
                background-color: #fff;
                border: 0.5vmin solid var(--color-green-light);
                box-shadow: var(--shadow-control);

                margin-top: var(--space-xl);
                padding: var(--space-md);
                width: 70vmin;
                box-sizing: border-box;

                &:hover{
                    color: #fff;
                    background-color: var(--color-green-light);
                    border: 0.5vmin solid #fff;
                }
            }

            #loginMessage{ font-size: 3.8vmin; }

            #loginLinkWrapper{
                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: var(--space-xl);

                #manual, #forgotPass{
                    text-decoration: underline;
                    font-size: 3.8vmin;
                    color: #DAD7CD;
                    cursor: pointer;
                    transition: transform 0.3s ease-in-out;

                    &:hover{ transform: scale(1.05); }
                }
            }
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            color: #fff;
            font-size: 5.5vmin;
            letter-spacing: 0.2vmin;
            text-align: center;

            img {
                width: 23vmin;
                height: 23vmin;
                image-rendering: pixelated;
            }

            p{ 
                font-family: "Jersey 10", Impact;
                padding: var(--space-md); 
            }

            &.fadeOut {
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.5s ease-out;
            }
        }
    </style>
</head>

<body>
    <h1 id="loginTitle">An AI-Driven 8-bit Web Game For Personalized College Program Matching and Career Exploration</h1>
    
    <section id="loginContainer">
        <button id="guestButton">Play as a Guest</button>

        <section class="lineDivider">
            <span class="line"></span>
            <span class="text">or login with existing account</span>
            <span class="line"></span>
        </section>

        <section id="accountLoginLayout">
            <input id="inputEmailId" placeholder="Enter your ID / Email" type="text" />

            <div id="passWrapper">
                <input id="inputPassword" placeholder="Enter your password" type="password" />

                <button type="button" id="togglePass">
                    <img src="assets/WebAssets/PadlockClosed.png" alt="Show/Hide PIN">
                </button>
            </div>
        </section>

        <button id="loginButton">Log In</button>
        <p id="loginMessage"></p>

        <section id="loginLinkWrapper">
            <a id="forgotPass" onclick="passwordRecovery()">Forgot Password?</a>
            <a id="manual" onclick="manual()">How To Play?</a>
        </section>

        <section id="loadingScreen">
            <section class="loadingBox">
                <img src="assets/WebAssets/Hourglass.gif" alt="Loading..." />
                <p>LOADING...</p>
            </section>
        </section>
    </section>

    <div id="loginModalRoot"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script type="module" src="src/pages/login/login.js"></script>
    <script type="module" src="src/pages/login/LoginOverlay.tsx"></script>
</body>
</html>

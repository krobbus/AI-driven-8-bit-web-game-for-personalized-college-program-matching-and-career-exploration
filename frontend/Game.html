<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>
      Outdoor - An AI-Driven 8-bit Web Game For Personalized College Program
      Matching and Career Exploration
    </title>
    <link rel="icon" type="image/x-icon" href="Logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      #rotate-warning {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #000;
        color: #fff;
        text-align: center;
        font-family: "Jersey 10", sans-serif;
        font-size: 3.8vmin;
        letter-spacing: 0.2vmin;
      }

      #rotate-warning p {
        max-width: 720px;
      }

      @media (orientation: portrait) {
        html body #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>

  <body>
    <div id="rotate-warning">
      <p>Rotate your device for better experience</p>
      <p>
        Make sure screen rotation is unlocked. If you still cannot view
        properly, please use a different browser/device
      </p>
    </div>

    <div id="game-container"></div>
    <div id="ui-root"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script type="module" src="./src/main.tsx"></script>

    <script>
      window.addEventListener("resize", () => {
        if (window.game && window.game.scale) {
          setTimeout(() => {
            window.game.scale.refresh();
          }, 200);
        }
      });
    </script>
  </body>
</html>
